[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kpl"
version = "0.1.0"
description = "Kikuyu Programming Language"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Joseph Waweru" }]

[project.urls]
Repository = "https://github.com/j-waweru/kpl"

[project.scripts]
kpl = "kpl.main:main"

[tool.setuptools]
packages = ["kpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
